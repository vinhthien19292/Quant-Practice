<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background: warm dark, rounded for maskable -->
  <rect width="512" height="512" fill="#1a1510" rx="90"/>

  <!-- Safe zone padding for maskable icons (~10% margin) -->
  <g transform="translate(256 256)">

    <!-- Atom orbital rings (accent gold) -->
    <g stroke="#e5a54e" stroke-width="10" fill="none" opacity="0.85">
      <ellipse cx="0" cy="0" rx="140" ry="55" transform="rotate(0)"/>
      <ellipse cx="0" cy="0" rx="140" ry="55" transform="rotate(60)"/>
      <ellipse cx="0" cy="0" rx="140" ry="55" transform="rotate(120)"/>
    </g>

    <!-- Central nucleus -->
    <circle cx="0" cy="0" r="28" fill="#e5a54e"/>

    <!-- Electron dots (mastered green) -->
    <circle cx="140" cy="0" r="12" fill="#86c084"/>
    <circle cx="-70" cy="-121" r="12" fill="#b8a4de"/>
    <circle cx="-70" cy="121" r="12" fill="#8fb5e0"/>

  </g>
</svg>
